<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <!-- Library view -->
  <section id="library">
    <header class="library-top">
      <div class="brand-mark" aria-hidden="true">✳</div>
      <div class="brand-copy"><strong>Library</strong></div>
      <div class="top-spacer"></div>
      <label class="btn primary add-book"><span>＋</span> Add book
        <input id="file-input" type="file" accept=".epub,.pdf,application/epub+zip,application/pdf" multiple hidden>
      </label>
    </header>
    <section class="shelf-section">
      <div class="shelf-heading"><div><h2>Books</h2></div></div>
      <div id="drop-hint"><span class="empty-icon">＋</span><strong>No books yet</strong><span>Add an EPUB or PDF to get started.</span></div>
      <div id="grid"></div>
    </section>
  </section>

  <!-- Reader view -->
  <section id="reader" hidden>
    <header class="bar">
      <button id="back" class="btn" title="Back to library">←</button>
      <div id="book-title" class="title"></div>
      <div class="tools">
        <button id="bm-btn" class="btn" title="Bookmark this page">☆</button>
        <button id="notes-btn" class="btn" title="Bookmarks &amp; notes">📝</button>
        <button id="toc-btn" class="btn" title="Table of contents">☰</button>
        <button id="settings-btn" class="btn" title="Text settings">Aa</button>
      </div>
    </header>

    <div id="search-dialog" class="search-dialog" hidden role="dialog" aria-modal="true" aria-label="Find in book">
      <div class="search-card">
        <div class="search-heading"><strong>Find in this book</strong><button id="search-close" class="btn" aria-label="Close search">×</button></div>
        <div class="search-controls"><input id="search-input" type="search" placeholder="Search words or phrases…" autocomplete="off"><button id="search-submit" class="btn primary">Find</button></div>
        <div id="search-status" class="search-status">Search the text of this book.</div>
        <div id="search-results" class="search-results"></div>
        <div class="search-footer"><span>Press Enter to search · Esc to close</span><span>Ctrl + F</span></div>
      </div>
    </div>

    <div id="stage">
      <aside id="toc" class="panel left" hidden></aside>

      <button id="prev" class="nav" aria-label="Previous page">‹</button>
      <div id="epub-sheet"><div id="viewer"></div></div>
      <div id="pdfview" hidden><div id="pdfpage"></div></div>
      <button id="next" class="nav" aria-label="Next page">›</button>
      <div id="loading" hidden>Opening book…</div>

      <!-- Text settings -->
      <aside id="settings" class="panel right" hidden>
        <h3 id="settings-title">Text settings</h3>
        <label class="field" id="font-field">Font
          <select id="font-select"></select>
        </label>
        <label class="field" id="size-field">Font size <span id="size-label">100%</span>
          <input id="size-range" type="range" min="70" max="220" step="5" value="100">
        </label>
        <label class="field" id="lh-field">Line spacing <span id="lh-label">Default</span>
          <input id="lh-range" type="range" min="11" max="24" step="1" value="11">
        </label>
        <label class="field" id="zoom-field" hidden>Zoom <span id="zoom-label">100%</span>
          <input id="zoom-range" type="range" min="50" max="300" step="10" value="100">
        </label>
        <label class="field" id="book-theme-field">Document theme
          <select id="theme">
            <option value="light">Light</option>
            <option value="slate">Slate</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="field">App background
          <select id="background-theme">
            <option value="light">Light</option>
            <option value="slate">Slate</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </aside>

      <!-- Bookmarks & notes -->
      <aside id="notes" class="panel right" hidden>
        <div class="tabs">
          <button id="tab-bm" class="tab active">Bookmarks</button>
          <button id="tab-hl" class="tab">Highlights</button>
        </div>
        <div id="notes-list"></div>
        <button id="export-btn" class="btn wide">Export notes (.md)</button>
      </aside>
    </div>

    <footer class="bar foot">
      <span id="progress-text">0%</span>
      <input id="progress" type="range" min="0" max="100" value="0">
    </footer>
  </section>

  <!-- Selection toolbar (appears after selecting text in the book) -->
  <div id="selbar" hidden>
    <button class="swatch" data-color="#cd6ceb" style="background:#cd6ceb" title="Orchid"></button>
    <button class="swatch" data-color="#89e21d" style="background:#89e21d" title="Lime"></button>
    <button class="swatch" data-color="#6f9bd8" style="background:#6f9bd8" title="Blue"></button>
    <button class="swatch" data-color="#ffd54f" style="background:#ffd54f" title="Yellow"></button>
    <button id="sel-note" class="btn">Note</button>
    <button id="sel-cancel" class="btn" title="Cancel">✕</button>
  </div>

  <!-- Note editor -->
  <div id="modal" hidden>
    <div class="modal-card">
      <blockquote id="modal-quote"></blockquote>
      <textarea id="modal-text" rows="5" placeholder="Write a note…"></textarea>
      <div class="modal-actions">
        <button id="modal-delete" class="btn danger">Delete highlight</button>
        <span class="spacer"></span>
        <button id="modal-cancel" class="btn">Cancel</button>
        <button id="modal-save" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>

  <script>
    // Try more than one CDN so a single blocked/unavailable host won't break the reader.
    function loadFirst(urls) {
      return urls.reduce((previous, url) => previous.catch(() => new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = url;
        script.onload = () => resolve(url);
        script.onerror = () => { script.remove(); reject(new Error("Could not load " + url)); };
        document.head.appendChild(script);
      })), Promise.reject());
    }

    (async () => {
      const libraries = [
        {
          name: "JSZip",
          urls: [
            "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
            "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js",
            "https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"
          ]
        },
        {
          name: "EPUB.js",
          urls: [
            "https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js",
            "https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js",
            "https://unpkg.com/epubjs@0.3.93/dist/epub.min.js"
          ]
        },
        {
          name: "PDF.js",
          urls: [
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js",
            "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"
          ]
        }
      ];

      for (const lib of libraries) {
        try {
          const loadedUrl = await loadFirst(lib.urls);
          if (lib.name === "PDF.js") {
            window.__pdfWorkerSrc = loadedUrl.includes("cdnjs.cloudflare.com")
              ? "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"
              : loadedUrl.includes("jsdelivr.net")
                ? "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"
                : "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
          }
          console.info(lib.name + " loaded from " + loadedUrl);
        } catch (error) {
          console.error(lib.name + " failed to load from all configured CDNs", error);
        }
      }

      const app = document.createElement("script");
      app.src = "app.js";
      document.body.appendChild(app);
    })();
  </script>
</body>
</html>
